# Deployed on the Hostinger VPS behind the n8n Traefik proxy.
# APP_HOST, AUTH_SECRET, AI_GATEWAY_KEY etc. come from the project environment.
name: brandmint
x-app: &app
  build:
    context: https://github.com/QuantumWeaveDev26/Social-growth.git#main
  image: brandmint-studio:latest
  pull_policy: build
  restart: unless-stopped
  environment:
    APP_URL: https://${APP_HOST}
    AUTH_SECRET: ${AUTH_SECRET:-}
    TOKEN_KEY: ${TOKEN_KEY:-}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
    AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
    AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
    AI_PLAN_MODEL: ${AI_PLAN_MODEL:-}
    AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-}
    TTS_VOICE_ID: ${TTS_VOICE_ID:-}
    TTS_MODEL: ${TTS_MODEL:-}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
    GENERATION_PAUSED: ${GENERATION_PAUSED:-}
    RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    META_APP_ID: ${META_APP_ID:-}
    META_APP_SECRET: ${META_APP_SECRET:-}
    META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
    META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
    INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
    INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
  volumes:
    - brandmint-data:/data

services:
  web:
    <<: *app
    command: ["web"]
    networks: [ingress]
    mem_limit: 1536m
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n_default
      traefik.http.routers.brandmint.rule: "Host(`${APP_HOST}`)"
      traefik.http.routers.brandmint.entrypoints: websecure
      traefik.http.routers.brandmint.tls: "true"
      traefik.http.routers.brandmint.tls.certresolver: mytlschallenge
      traefik.http.services.brandmint.loadbalancer.server.port: "3000"
  worker:
    <<: *app
    command: ["worker"]
    pull_policy: never
    depends_on: [web]
    mem_limit: 3g
    networks: [ingress]

volumes:
  brandmint-data:

networks:
  ingress:
    external: true
    name: n8n_default
